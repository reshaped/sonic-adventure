name: check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - run: make test
      - run: |
          make -j"$(nproc)" check || {
            echo "::warning::make check failed; retrying once."
            make -j"$(nproc)" check
          }
      - run: make -j"$(nproc)" lint
      # check and lint build shckit; without the disc, nothing builds these
      - run: make build/gdi build/prskit
